# Automatically label pull requests by the files they change.
documentation:
  - changed-files:
      - any-glob-to-any-file: '**/*.md'
      - any-glob-to-any-file: '**/*.mdx'

enhancement:
  - changed-files:
      - any-glob-to-any-file:
          - 'desktop/**'
          - 'electron-builder.yml'
          - 'scripts/package-*.js'
          - 'scripts/package-*.cjs'
          - 'docs/wine-winlator.md'

bug:
  - changed-files:
      - any-glob-to-any-file:
          - 'server/**'
          - 'public/scripts/**'
          - 'test/**'
