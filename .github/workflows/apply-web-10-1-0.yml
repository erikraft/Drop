name: Apply ErikrafT Drop Web 10.1.0 update

on:
  push:
    branches:
      - feat/drop-10.1.0-webtorrent-ui-docs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration script
        run: python3 .github/workflows/apply_web_10_1_0.py
      - name: Validate WebTorrent JavaScript
        run: node --check public/scripts/webtorrent-transfer.js
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat: update web to 10.1.0 with WebTorrent beta and UI refresh'
          git push
