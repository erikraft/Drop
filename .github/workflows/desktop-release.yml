name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-deb:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Debian package
        run: npm run package:linux
      - name: Validate Debian package
        run: |
          test -s dist/desktop/erikraft-drop-linux-amd64.deb
          dpkg-deb --info dist/desktop/erikraft-drop-linux-amd64.deb >/dev/null
          ls -lh dist/desktop/erikraft-drop-linux-amd64.deb
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: erikraft-drop-linux-deb
          path: dist/desktop/erikraft-drop-linux-amd64.deb
          if-no-files-found: error
      - name: Attach Linux package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/desktop/erikraft-drop-linux-amd64.deb
          fail_on_unmatched_files: true
          overwrite_files: true

  windows-exe:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate WinSparkle signing secret
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINSPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.WINSPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINSPARKLE_ED25519_PRIVATE_KEY)) {
            throw 'Missing required repository Actions secret WINSPARKLE_ED25519_PRIVATE_KEY. Add the existing WinSparkle Ed25519 private key in Settings > Secrets and variables > Actions before creating a release tag. A new key must not be generated for an existing release signing key.'
          }
          Write-Host 'WinSparkle signing secret is configured.'

      - name: Build Windows installer
        run: npm run package:windows
      - name: Validate Windows installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist/desktop -Filter *.exe | Select-Object -First 1
          if (-not $exe -or $exe.Length -le 0) { throw 'Windows installer was not generated.' }
          Write-Host "Generated: $($exe.FullName) ($($exe.Length) bytes)"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: erikraft-drop-windows-exe
          path: dist/desktop/*.exe
          if-no-files-found: error

      - name: Generate signed WinSparkle appcast
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINSPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.WINSPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP 'winsparkle'
          $zip = Join-Path $temp 'WinSparkle-0.9.4.zip'
          $extract = Join-Path $temp 'extracted'
          $key = Join-Path $temp 'private.key'
          New-Item -ItemType Directory -Force -Path $temp,$extract | Out-Null

          try {
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/vslavik/winsparkle/releases/download/v0.9.4/WinSparkle-0.9.4.zip' -OutFile $zip
            $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
            if ($hash -ne '6037df37fc263bd1650a1c4949681a9d40ffe991d01f35892a406cb5d103c976') {
              throw "WinSparkle archive SHA-256 mismatch: $hash"
            }

            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            $tool = Get-ChildItem -Path $extract -Recurse -Filter 'winsparkle-tool.exe' | Select-Object -First 1
            if (-not $tool) { throw 'winsparkle-tool.exe was not found.' }

            $env:WINSPARKLE_ED25519_PRIVATE_KEY | Set-Content -Path $key -NoNewline
            $exe = Get-ChildItem -Path dist/desktop -Filter '*-win-x64.exe' | Select-Object -First 1
            if (-not $exe) { throw 'Windows installer was not found.' }

            $signature = (& $tool.FullName sign --private-key-file $key $exe.FullName | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($signature)) {
              throw "WinSparkle signing failed: $signature"
            }

            $length = "$($exe.Length)"
            if ($signature -match 'sparkle:edSignature="([^"]+)"') {
              $edSignature = $Matches[1]
              if ($signature -match 'length="(\d+)"') {
                $length = $Matches[1]
              }
            }
            elseif ($signature -match '^[A-Za-z0-9+/=]+$') {
              $edSignature = $signature
            }
            else {
              throw "WinSparkle signing output format was not recognized: $signature"
            }
            $version = '${{ github.ref_name }}'.TrimStart('v')
            $installerUrl = "https://github.com/erikraft/Drop/releases/download/v$version/$($exe.Name)"
            $releaseUrl = "https://github.com/erikraft/Drop/releases/tag/v$version"
            $pubDate = (Get-Date).ToUniversalTime().ToString('ddd, dd MMM yyyy HH:mm:ss +0000', [Globalization.CultureInfo]::InvariantCulture)

            @"
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>ErikrafT Drop™ Windows Updates</title>
              <description>Signed Windows updates for ErikrafT Drop™ desktop.</description>
              <language>en</language>
              <item>
                <title>Version $version</title>
                <link>$releaseUrl</link>
                <sparkle:version>$version</sparkle:version>
                <sparkle:releaseNotesLink>$releaseUrl</sparkle:releaseNotesLink>
                <pubDate>$pubDate</pubDate>
                <enclosure
                  url="$installerUrl"
                  sparkle:os="windows-x64"
                  sparkle:edSignature="$edSignature"
                  sparkle:installerArguments="/S"
                  length="$length"
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          "@ | Set-Content -Path dist/desktop/winsparkle-appcast.xml -Encoding UTF8
          }
          finally {
            if (Test-Path -LiteralPath $key) {
              Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Attach signed WinSparkle appcast to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/desktop/winsparkle-appcast.xml
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Attach Windows installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/desktop/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
