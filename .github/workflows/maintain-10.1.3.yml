name: Maintain 10.1.3

on:
  push:
    branches:
      - fix/v10.1.3-complete
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintain-10.1.3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Regenerate package-lock.json with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove stale index metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('<link rel="stylesheet" type="text/css" href="styles/content-moderation.css">\n', '')
          text = text.replace('"softwareVersion": "10.1.1"', '"softwareVersion": "10.1.3"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove obsolete moderation translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'^\s*"moderation-(?:warning-title|warning-message|no|yes)":.*\n', re.MULTILINE)
          changed = []
          for path in sorted(Path('public/lang').glob('*.json')):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn('', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append((path.name, count))
          if changed:
              print('Removed obsolete moderation keys:')
              for name, count in changed:
                  print(f'  {name}: {count}')
          else:
              print('No obsolete moderation keys found.')
          PY

      - name: Commit generated maintenance changes
        run: |
          if git diff --quiet -- package-lock.json public/index.html public/lang; then
            echo 'No generated maintenance changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json public/index.html public/lang
          git commit -m 'chore: remove obsolete moderation translations'
          git push

      - name: Validate active release metadata
        run: |
          set -eu
          test "$(node -p "require('./package.json').version")" = "10.1.3"
          test "$(node -p "require('./package-lock.json').version")" = "10.1.3"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "10.1.3"
          test "$(grep -o "v10.1.3" public/service-worker.js | head -n 1)" = "v10.1.3"
          ! grep -Fq 'content-moderation.css' public/index.html
          ! grep -Fq '"softwareVersion": "10.1.1"' public/index.html

      - name: Scan language files for legacy moderation keys
        run: |
          if grep -RniE 'content[-_ ]moderation|moderation' public/lang; then
            echo 'Legacy moderation references remain in public/lang/*.json.'
            exit 1
          fi

      - name: Scan active web tree for stale versions
        run: |
          set -eu
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude='*.map' 'v1\.16\.[0-9]+|1\.16\.[0-9]+|v10\.1\.[12]|10\.1\.[12]' public package.json package-lock.json server test .github; then
            echo 'Stale release-version references remain in active files.'
            exit 1
          fi

      - name: Run web tests
        run: npm test
