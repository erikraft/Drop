name: Maintain 10.1.3

on:
  push:
    branches:
      - fix/v10.1.3-complete
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintain-10.1.3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Regenerate package-lock.json with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Normalize stale release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'public/index.html': {
                  '<link rel="stylesheet" type="text/css" href="styles/content-moderation.css">\n': '',
                  '"softwareVersion": "10.1.1"': '"softwareVersion": "10.1.3"',
                  'v10.1.1': 'v10.1.3',
              },
              'public/manifest.json': {
                  '"version": "1.16.6"': '"version": "10.1.3"',
              },
              '.github/ISSUE_TEMPLATE/bug-report.md': {
                  'Version: v10.1.1': 'Version: v10.1.3',
              },
          }
          for filename, rules in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in rules.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove obsolete moderation translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'^\s*"moderation-(?:warning-title|warning-message|no|yes)":.*\n', re.MULTILINE)
          changed = []
          for path in sorted(Path('public/lang').glob('*.json')):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn('', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append((path.name, count))
          if changed:
              print('Removed obsolete moderation keys:')
              for name, count in changed:
                  print(f'  {name}: {count}')
          else:
              print('No obsolete moderation keys found.')
          PY

      - name: Commit generated maintenance changes
        run: |
          if git diff --quiet -- package-lock.json public/index.html public/lang public/manifest.json .github/ISSUE_TEMPLATE/bug-report.md; then
            echo 'No generated maintenance changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json public/index.html public/lang public/manifest.json .github/ISSUE_TEMPLATE/bug-report.md
          git commit -m 'chore: normalize 10.1.3 release metadata'
          git push

      - name: Validate active release metadata
        run: |
          set -eu
          test "$(node -p "require('./package.json').version")" = "10.1.3"
          test "$(node -p "require('./package-lock.json').version")" = "10.1.3"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "10.1.3"
          test "$(node -p "require('./public/manifest.json').version")" = "10.1.3"
          grep -Fq 'v10.1.3' public/service-worker.js
          ! grep -Fq 'content-moderation.css' public/index.html
          ! grep -Fq '"softwareVersion": "10.1.1"' public/index.html

      - name: Scan language files for legacy moderation keys
        run: |
          if grep -RniE 'content[-_ ]moderation|moderation' public/lang; then
            echo 'Legacy moderation references remain in public/lang/*.json.'
            exit 1
          fi

      - name: Scan active source tree for stale release versions
        run: |
          set -eu
          targets='public package.json server test .github'
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.map' \
            --exclude='maintain-10.1.3.yml' \
            'v1\.16\.[0-9]+|v10\.1\.[12]|10\.1\.[12]' $targets; then
            echo 'Stale ErikrafT Drop release-version references remain in active files.'
            exit 1
          fi

      - name: Check lockfile root metadata only
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          if (lock.version !== '10.1.3' || lock.packages?.['']?.version !== '10.1.3') {
            throw new Error('package-lock.json root metadata is not 10.1.3');
          }
          NODE

      - name: Run web tests
        run: npm test
