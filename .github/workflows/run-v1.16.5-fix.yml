name: Run v1.16.5 startup fix

on:
  push:
    branches:
      - fix/startup-loading-freeze-v1.16.5

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/startup-loading-freeze-v1.16.5
          fetch-depth: 0

      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          root = Path('.')
          main_path = root / 'public/scripts/main.js'
          main = main_path.read_text(encoding='utf-8')

          old = """            'scripts/animated-qr-file-size.js',
            'scripts/animated-qr-screen-awake.js',
            'scripts/network.js',
            'scripts/ui.js',"""
          new = """            'scripts/animated-qr-file-size.js',
            'scripts/network.js',
            'scripts/ui.js',
            'scripts/animated-qr-screen-awake.js',"""
          if old not in main:
              raise SystemExit('Could not locate deferred script order in main.js')
          main = main.replace(old, new, 1)

          old = """    loadDeferredAssets() {
        const stylePromises = this.deferredStyles.map(url => this.loadAndApplyStylesheet(url));
        const scriptPromises = this.deferredScripts.map(url => this.loadAndApplyScript(url));
        return Promise.all([...stylePromises, ...scriptPromises]);
    }"""
          new = """    async loadDeferredAssets() {
        const stylePromises = this.deferredStyles.map(url => this.loadAndApplyStylesheet(url));
        const optionalMarker = 'scripts/animated-qr-screen-awake.js';
        const optionalIndex = this.deferredScripts.indexOf(optionalMarker);
        const criticalScripts = optionalIndex >= 0 ? this.deferredScripts.slice(0, optionalIndex) : this.deferredScripts;
        const optionalScripts = optionalIndex >= 0 ? this.deferredScripts.slice(optionalIndex) : [];

        // The interactive shell must not depend on optional QR/supplementary assets.
        await Promise.all([
            ...stylePromises,
            ...criticalScripts.map(url => this.loadAndApplyScript(url, { timeoutMs: 5000 }))
        ]);

        // Load optional enhancements after the shell is interactive and never block startup.
        void Promise.all(optionalScripts.map(url => this.loadAndApplyScript(url, { timeoutMs: 5000, async: true })))
            .catch(error => console.warn('[App] Optional deferred assets failed:', error));
    }"""
          if old not in main:
              raise SystemExit('Could not locate loadDeferredAssets in main.js')
          main = main.replace(old, new, 1)

          old = """    loadScript(url) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = url;
            script.async = false;
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
        });
    }"""
          new = """    loadScript(url, options = {}) {
        const { timeoutMs = 5000, async = false } = options;
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            let settled = false;
            let timeoutId;
            const finish = (callback, value) => {
                if (settled) return;
                settled = true;
                clearTimeout(timeoutId);
                callback(value);
            };
            script.src = url;
            script.async = async;
            script.onload = () => finish(resolve);
            script.onerror = error => finish(reject, error);
            timeoutId = setTimeout(() => {
                finish(reject, new Error(`Timed out loading script after ${timeoutMs}ms: ${url}`));
            }, timeoutMs);
            document.body.appendChild(script);
        });
    }"""
          if old not in main:
              raise SystemExit('Could not locate loadScript in main.js')
          main = main.replace(old, new, 1)

          old = """    async loadAndApplyScript(url) {
        try {
            await this.loadScript(url);
            console.log(`Script loaded successfully: ${url}`);
        } catch (error) {
            console.error('Error loading script:', url, error);
        }
    }"""
          new = """    async loadAndApplyScript(url, options = {}) {
        try {
            await this.loadScript(url, options);
            console.log(`Script loaded successfully: ${url}`);
        } catch (error) {
            console.warn('[App] Deferred script unavailable; continuing without blocking startup:', url, error);
        }
    }"""
          if old not in main:
              raise SystemExit('Could not locate loadAndApplyScript in main.js')
          main = main.replace(old, new, 1)
          main_path.write_text(main, encoding='utf-8')

          index_path = root / 'public/index.html'
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'("softwareVersion"\s*:\s*")1\.16\.[0-9]+', r'\g<1>1.16.5', index, count=1)
          index_path.write_text(index, encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '1.16.5'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = root / 'public/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '1.16.5'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          sw_path = root / 'public/service-worker.js'
          sw = sw_path.read_text(encoding='utf-8').replace("const cacheVersion = 'v1.16.4';", "const cacheVersion = 'v1.16.5';", 1)
          sw_path.write_text(sw, encoding='utf-8')

          bug_path = root / '.github/ISSUE_TEMPLATE/bug-report.md'
          bug = bug_path.read_text(encoding='utf-8').replace('Version: v1.16.4', 'Version: v1.16.5', 1)
          bug_path.write_text(bug, encoding='utf-8')

          for path in [main_path, index_path, package_path, manifest_path, sw_path, bug_path]:
              text = path.read_text(encoding='utf-8')
              if 'v1.16.4' in text or '"1.16.4"' in text:
                  raise SystemExit(f'Old version reference remains in {path}')

          print('Patch applied.')

      - name: Validate
        run: |
          node --check public/scripts/main.js
          node --check public/service-worker.js

      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-startup-freeze-v1.16.5.yml .github/workflows/run-v1.16.5-fix.yml
          git add public/scripts/main.js public/index.html package.json public/manifest.json public/service-worker.js .github/ISSUE_TEMPLATE/bug-report.md .github/workflows/
          git commit -m 'fix: prevent deferred assets from blocking startup'
          git push origin fix/startup-loading-freeze-v1.16.5
