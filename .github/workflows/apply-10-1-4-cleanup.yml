name: apply-10-1-4-cleanup
on:
  push:
    branches: [fix/drop-10.1.4-stability-cleanup]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup and stability fixes
        shell: python
        run: |
          from pathlib import Path
          import json, re, subprocess
          root = Path('.')
          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')
          p = root/'public/index.html'; s = read(p)
          patterns = [r'\s*<!-- Removed: LAN Mode -->\s*<!--.*?</div>\s*-->',r'\s*<!-- <div id="cloud".*?</div>\s*-->',r'\s*<!-- Removed: Comet Browser button -->\s*<!--.*?</div>\s*-->',r'\s*<!-- Removed: BrowserOS button -->\s*<!--.*?</div>\s*-->',r'\s*<!-- Removed: Comet Browser Popup -->\s*<!--.*?</div>\s*-->',r'\s*<!-- Removed: BrowserOS Popup \(computer only\) -->\s*<!--.*?</div>\s*-->',r'\s*<!--\s*<div id="discord".*?</div>\s*-->',r'\s*<!-- <a href="https://limewire.com/".*?</a>\s*-->',r'\s*<!-- <div id="animated-qr-btn".*?</div>\s*-->']
          for pat in patterns: s = re.sub(pat, '\n', s, flags=re.S|re.I)
          s = re.sub(r'\s*//\s*Removido: Lógica do popup Comet Browser\s*\n\s*/\*.*?\*/', '', s, flags=re.S|re.I)
          s = re.sub(r'\s*//\s*Removido: Lógica do popup BrowserOS\s*\n\s*/\*.*?\*/', '', s, flags=re.S|re.I)
          s = re.sub(r'\n\s*<!--[^>]*(?:comet|browseros|limewire|lan-mode|discord)[^>]*-->\s*', '\n', s, flags=re.I)
          if 'id="webtorrent-btn"' not in s:
              marker='        <div id="tor-config-btn" class="icon-button"'
              button='''        <div id="webtorrent-btn" class="icon-button" data-i18n-key="header.torrent" data-i18n-attrs="title aria-label" title="Torrent" aria-label="Torrent">\n            <svg class="icon" aria-hidden="true">\n                <use xlink:href="#torrent-icon"></use>\n            </svg>\n        </div>\n'''
              s=s.replace(marker,button+marker,1)
          if 'id="torrent-icon"' not in s:
              svg_marker='        <symbol id="info-outline"'
              symbol='''        <symbol id="torrent-icon" viewBox="0 0 24 24" aria-label="Torrent">\n            <!-- BitTorrent brand mark; source: bittorrent.com brand assets. -->\n            <path d="M12.0002.0014C5.3735.0004.001 5.3718 0 11.9984a11.9986 11.9986 0 0 0 1.7006 6.1593.132.132 0 0 0 .1128.0384c.0288 0 .048-.0696.048-.1104a.739.739 0 0 0-.0336-.1296 22.14 22.14 0 0 1-.4224-2.2941 9.8389 9.8389 0 0 1 .4272-3.866c1.1014-3.3956 3.3332-5.6993 6.664-6.9376a10.302 10.302 0 0 1 3.398-.5951.7823.7823 0 0 1 .8567.763c0 .4488-.3431.7368-.8495.7656a12.853 12.853 0 0 0-1.6078.1656 8.6918 8.6918 0 0 0-4.8642 2.6397C3.3332 10.8169 2.55 13.4566 3.03 16.4539a8.6846 8.6846 0 0 0 2.4454 4.785 8.9414 8.9414 0 0 0 6.3688 2.7597h.156a11.9507 11.9507 0 0 0 5.613-1.3918h-5.5938a8.3988 8.3988 0 0 1-1.4086-.1296c-4.1387-.7468-6.915-4.673-6.2393-8.8238.5627-3.5271 3.4722-6.2073 7.0336-6.4793a7.6407 7.6407 0 0 1 2.1597.1368.7487.7487 0 0 1 .6168.876.7847.7847 0 0 1-.96.6023c-1.5988-.9125-3.6346-.356-4.547 1.2428a3.3332 3.3332 0 0 0-.3964 2.1792c.2433 1.6186 1.6388 2.8127 3.2756 2.8029 3.3596.0336 6.7193 0 10.0789 0a.4224.4224 0 0 0 .2807-.144c3.3584-5.7126 1.45-13.0661-4.2626-16.4245a11.9986 11.9986 0 0 0-6.0802-1.655z" fill="currentColor"/>\n        </symbol>\n'''
              s=s.replace(svg_marker,symbol+svg_marker,1)
          write(p,s)
          legacy=re.compile(r'(?:comet|browseros|limewire|lan-mode)',re.I)
          for css in (root/'public').rglob('*.css'):
              text=read(css); out=[]; i=0; n=len(text)
              while i<n:
                  b=text.find('{',i)
                  if b<0: out.append(text[i:]); break
                  start=max(text.rfind('}',i,b),text.rfind(';',i,b))+1; e=text.find('}',b+1)
                  if e<0: out.append(text[i:]); break
                  selector=text[start:b].strip()
                  if legacy.search(selector): out.append(text[i:start]); i=e+1
                  else: out.append(text[i:e+1]); i=e+1
              new=re.sub(r'\n\s*\n\s*\n+','\n\n',''.join(out))
              if new!=text: write(css,new)
          p=root/'public/scripts/animated-qr-screen-awake.js'; s=read(p)
          old="""    const observer = new MutationObserver(records => {\n        if (mutationAffectsRuntime(records)) {\n            ensureButton();\n            fillAnimatedQrTextFromClipboard();\n            removeDuplicateCopyButtons();\n            normalizeVisibleBranding();\n            syncNativeDialogLock();\n        }\n    });"""
          new="""    let runtimeSyncFrame = 0;\n    let runtimeSyncPending = false;\n    const scheduleRuntimeSync = () => {\n        if (runtimeSyncFrame) return;\n        runtimeSyncFrame = requestAnimationFrame(() => {\n            runtimeSyncFrame = 0;\n            if (!runtimeSyncPending) return;\n            runtimeSyncPending = false;\n            ensureButton();\n            fillAnimatedQrTextFromClipboard();\n            removeDuplicateCopyButtons();\n            syncNativeDialogLock();\n        });\n    };\n    const observer = new MutationObserver(records => {\n        if (!mutationAffectsRuntime(records)) return;\n        runtimeSyncPending = true;\n        scheduleRuntimeSync();\n    });"""
          if old in s: s=s.replace(old,new)
          s=s.replace('        normalizeVisibleBranding();\n        syncNativeDialogLock();','        requestAnimationFrame(() => normalizeVisibleBranding());\n        syncNativeDialogLock();',1)
          write(p,s)
          p=root/'public/scripts/main.js'; s=read(p).replace('await Promise.all(deferredAssets);','await Promise.allSettled(deferredAssets)'); write(p,s)
          p=root/'public/service-worker.js'; s=read(p); s=re.sub(r"const cacheVersion = ['\"]v[^'\"]+['\"]","const cacheVersion = 'v10.1.4'",s,count=1); write(p,s)
          p=root/'package.json'; data=json.loads(read(p)); data['version']='10.1.4'; write(p,json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          p=root/'server/server.js'; s=read(p)
          if "app.get('/.well-known/assetlinks.json'" not in s:
              needle="        const publicPathAbs = path.join(__dirname, '../public');\n        app.use(express.static(publicPathAbs));"
              repl="""        const publicPathAbs = path.join(__dirname, '../public');\n        const assetLinksPath = path.join(publicPathAbs, '.well-known', 'assetlinks.json');\n        app.get('/.well-known/assetlinks.json', (req, res) => {\n            res.type('application/json').sendFile(assetLinksPath);\n        });\n        app.use(express.static(publicPathAbs));"""
              s=s.replace(needle,repl,1)
          write(p,s)
          for f in [root/'public/index.html',root/'public/manifest.json']:
              if f.exists():
                  t=read(f).replace('"softwareVersion": "10.1.3"','"softwareVersion": "10.1.4"').replace('"version": "10.1.3"','"version": "10.1.4"'); write(f,t)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True); subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','-A'],check=True); subprocess.run(['git','commit','-m','fix: clean legacy UI and harden startup'],check=False)
          subprocess.run(['git','rm','-f','.github/workflows/apply-10-1-4-cleanup.yml'],check=False); subprocess.run(['git','commit','-m','chore: remove temporary migration workflow'],check=False); subprocess.run(['git','push'],check=True)
