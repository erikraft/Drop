name: Packaging PR Check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'flatpak/**'
      - '.github/workflows/**'
      - 'public/**'
      - 'packaging/**'
      - 'scripts/**'

permissions:
  contents: read

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  # Keep electron-builder's generated helper scripts outside the repository.
  # Otherwise root "type": "module" makes cached CommonJS helpers load as ESM.
  ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

jobs:
  linux-deb:
    name: Validate Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            ${{ runner.temp }}/electron-builder-cache
          key: builder-cache-outside-root-v1-${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            builder-cache-outside-root-v1-${{ runner.os }}-electron-
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed (attempt $attempt/3); retrying after a short delay..."
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - run: npm run package:linux
      - run: |
          test -s dist/desktop/erikraft-drop-linux-amd64.deb
          dpkg-deb --info dist/desktop/erikraft-drop-linux-amd64.deb >/dev/null

  windows-exe:
    name: Validate Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            ${{ runner.temp }}/electron-builder-cache
          key: builder-cache-outside-root-v1-${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            builder-cache-outside-root-v1-${{ runner.os }}-electron-
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "npm ci failed (attempt $attempt/3); retrying after a short delay..."
              Start-Sleep -Seconds ($attempt * 10)
            }
          }
          exit 1
      - run: npm run package:windows
      - shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist/desktop -Filter *.exe | Select-Object -First 1
          if (-not $exe -or $exe.Length -le 0) { throw 'Windows installer was not generated.' }
          Write-Host "Generated: $($exe.FullName)"
