name: Packaging PR Check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'flatpak/**'
      - '.github/workflows/**'
      - 'public/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'server/**'
      - 'test/**'

permissions:
  contents: read

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  linux-deb:
    name: Validate Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            ${{ runner.temp }}/electron-builder-cache
          key: builder-cache-runner-temp-v3-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            builder-cache-runner-temp-v3-electron-
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed (attempt $attempt/3); retrying after a short delay..."
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Audit npm dependency trees
        run: |
          npm audit --audit-level=high
          npm --prefix Discord/Bot audit --audit-level=high
      - name: Run repository test suite
        run: npm test
      - name: Build Linux package
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: npm run package:linux
      - run: |
          test -s dist/desktop/erikraft-drop-linux-amd64.deb
          dpkg-deb --info dist/desktop/erikraft-drop-linux-amd64.deb >/dev/null

  windows-exe:
    name: Validate Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            ${{ runner.temp }}/electron-builder-cache
          key: builder-cache-runner-temp-v3-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            builder-cache-runner-temp-v3-electron-
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "npm ci failed (attempt $attempt/3); retrying after a short delay..."
              Start-Sleep -Seconds ($attempt * 10)
            }
          }
          exit 1
      - name: Test portable Windows packaging configuration
        run: node --test test/desktop-portable.test.js
      - name: Build Windows installer and portable executable
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: npm run package:windows
      - shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist/desktop -Filter '*-win-x64.exe' | Select-Object -First 1
          $portable = Get-ChildItem -Path dist/desktop -Filter '*-win-x64-portable.exe' | Select-Object -First 1
          if (-not $installer -or $installer.Length -le 0) { throw 'Windows NSIS installer was not generated.' }
          if (-not $portable -or $portable.Length -le 0) { throw 'Windows portable executable was not generated.' }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Portable: $($portable.FullName)"
