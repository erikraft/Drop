name: Packaging PR Check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'flatpak/**'
      - '.github/workflows/**'
      - 'public/**'
      - 'packaging/**'
      - 'scripts/**'

permissions:
  contents: read

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  linux-deb:
    name: Validate Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed (attempt $attempt/3); retrying after a short delay..."
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - run: npm run package:linux
      - run: |
          test -s dist/desktop/erikraft-drop-linux-amd64.deb
          dpkg-deb --info dist/desktop/erikraft-drop-linux-amd64.deb >/dev/null

  windows-exe:
    name: Validate Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "npm ci failed (attempt $attempt/3); retrying after a short delay..."
              Start-Sleep -Seconds ($attempt * 10)
            }
          }
          exit 1
      - run: npm run package:windows
      - shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist/desktop -Filter *.exe | Select-Object -First 1
          if (-not $exe -or $exe.Length -le 0) { throw 'Windows installer was not generated.' }
          Write-Host "Generated: $($exe.FullName)"

  torrent-static-check:
    name: Validate embedded Torrent surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-tree -r --name-only HEAD | grep -Fxq 'public/torrent.html'
          ! git ls-tree -r --name-only HEAD | grep -Fxq 'public/torrent.js'
          node test/webtorrent-transfer.test.js
          node test/service-worker-cache.test.js
