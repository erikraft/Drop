name: Repair Optical Matrix review
on:
  push:
    branches: [fix/drop-10.1.4-stability-cleanup]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index from pre-accidental update and apply minimal review fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout ca3c86d757251afa73be93c4f5f66e8326578cc7 -- public/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          old = '<div class="font-body1 bold text-primary" data-i18n-key="dialogs.optical-matrix-title">ErikrafT Optical Matrix <span class="font-caption" data-i18n-key="dialogs.optical-matrix-experimental">Experimental</span></div>'
          new = '<div class="font-body1 bold text-primary" data-i18n-key="dialogs.optical-matrix-title">ErikrafT Optical Matrix</div>\n                            <span class="font-caption" data-i18n-key="dialogs.optical-matrix-experimental">Experimental</span>'
          if old not in s:
              raise SystemExit('Optical Matrix markup target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python - <<'PY'
          from pathlib import Path
          p = Path('public/scripts/optical-matrix-ui.js')
          s = p.read_text()
          old = "document.getElementById('optical-matrix-info-btn')?.addEventListener('click', open, { once: true });"
          new = "document.getElementById('optical-matrix-info-btn')?.addEventListener('click', open);"
          if old not in s:
              raise SystemExit('Optical Matrix bind target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/scripts/optical-matrix-ui.js .github/workflows/repair-optical-review.yml
          git rm .github/workflows/repair-optical-review.yml
          git commit -m 'fix: address Optical Matrix review comments'
          git push
