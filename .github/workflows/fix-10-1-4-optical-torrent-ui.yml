name: Fix Optical Matrix and Torrent UI

on:
  push:
    branches:
      - fix/drop-10.1.4-stability-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/drop-10.1.4-stability-cleanup
          fetch-depth: 1

      - name: Apply UI fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')

          # 1) Remove the obsolete active Animated QR header button.
          p = root / 'public/index.html'
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'\s*<div\s+id=["\']animated-qr-btn["\'][\s\S]*?</div>\s*', '\n', s, count=1, flags=re.I)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')

          # 2) Optical Matrix: make the button translatable.
          p = root / 'public/index.html'
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '<div class="font-body1 bold text-primary">ErikrafT Optical Matrix <span class="font-caption">Experimental</span></div>',
              '<div class="font-body1 bold text-primary" data-i18n-key="dialogs.optical-matrix-title">ErikrafT Optical Matrix <span class="font-caption" data-i18n-key="dialogs.optical-matrix-experimental">Experimental</span></div>'
          )
          s = s.replace(
              '<div class="font-body2 text-center text-secondary mb-2">A high-density colour-and-symbol optical matrix. It is separate from QR Animado — Legacy/Compatibility.</div>',
              '<div class="font-body2 text-center text-secondary mb-2" data-i18n-key="dialogs.optical-matrix-description">A high-density colour-and-symbol optical matrix. It is separate from QR Animado — Legacy/Compatibility.</div>'
          )
          s = s.replace(
              '<button id="optical-matrix-info-btn" type="button" class="btn btn-rounded btn-grey">Open Optical Matrix</button>',
              '<button id="optical-matrix-info-btn" type="button" class="btn btn-rounded btn-grey" data-i18n-key="dialogs.optical-matrix-open">Open Optical Matrix</button>'
          )
          p.write_text(s, encoding='utf-8')

          # 3) Fix Optical Matrix handler when its deferred script is loaded after DOMContentLoaded.
          p = root / 'public/scripts/optical-matrix-ui.js'
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "document.addEventListener('DOMContentLoaded', () => document.getElementById('optical-matrix-info-btn')?.addEventListener('click', open));",
              "const bind = () => document.getElementById('optical-matrix-info-btn')?.addEventListener('click', open, { once: true });\n    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind, { once: true });\n    else bind();"
          )
          # Localize the generated experimental dialog and make its open/close behavior robust.
          s = s.replace(
              "dialog.innerHTML = '<form method=\"dialog\"><h2>ErikrafT Optical Matrix <small>Experimental</small></h2><p>Colour and symbol matrix for local optical experiments. It is not Cimbar or CFC compatible, and camera decoding is not available yet.</p><label for=\"optical-matrix-text\">Text to encode</label><textarea id=\"optical-matrix-text\" rows=\"4\" maxlength=\"400\"></textarea><p id=\"optical-matrix-status\" role=\"status\"></p><canvas id=\"optical-matrix-canvas\" aria-label=\"Optical Matrix encoded payload\"></canvas><menu><button value=\"cancel\" class=\"btn btn-rounded btn-grey\">Close</button><button type=\"button\" id=\"optical-matrix-generate\" class=\"btn btn-rounded btn-primary\">Generate matrix</button></menu></form>';",
              "dialog.innerHTML = '<form method=\"dialog\"><h2 data-i18n-key=\"dialogs.optical-matrix-title\">ErikrafT Optical Matrix <small data-i18n-key=\"dialogs.optical-matrix-experimental\">Experimental</small></h2><p data-i18n-key=\"dialogs.optical-matrix-dialog-description\">Colour and symbol matrix for local optical experiments. It is not Cimbar or CFC compatible, and camera decoding is not available yet.</p><label for=\"optical-matrix-text\" data-i18n-key=\"dialogs.optical-matrix-text-label\">Text to encode</label><textarea id=\"optical-matrix-text\" rows=\"4\" maxlength=\"400\"></textarea><p id=\"optical-matrix-status\" role=\"status\"></p><canvas id=\"optical-matrix-canvas\" aria-label=\"Optical Matrix encoded payload\"></canvas><menu><button value=\"cancel\" class=\"btn btn-rounded btn-grey\" data-i18n-key=\"dialogs.close\">Close</button><button type=\"button\" id=\"optical-matrix-generate\" class=\"btn btn-rounded btn-primary\" data-i18n-key=\"dialogs.optical-matrix-generate\">Generate matrix</button></menu></form>';\n            try { window.erikrafTdrop?.localization?.translate?.(dialog); } catch (_) {}"
          )
          s = s.replace(
              "if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open', '');",
              "try { if (typeof dialog.showModal === 'function' && !dialog.open) dialog.showModal(); else dialog.setAttribute('open', ''); } catch (error) { dialog.setAttribute('open', ''); }"
          )
          p.write_text(s, encoding='utf-8')

          # 4) Add PT-BR translations for the Optical Matrix feature.
          p = root / 'public/lang/pt-BR.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          dialogs = data.setdefault('dialogs', {})
          translations = {
              'optical-matrix-title': 'ErikrafT Optical Matrix',
              'optical-matrix-experimental': 'Experimental',
              'optical-matrix-description': 'Uma matriz óptica de alta densidade com cores e símbolos. Ela é separada do QR Animado — Legado/Compatibilidade.',
              'optical-matrix-open': 'Abrir Optical Matrix',
              'optical-matrix-dialog-description': 'Matriz de cores e símbolos para experimentos ópticos locais. Ela não é compatível com Cimbar ou CFC, e a decodificação por câmera ainda não está disponível.',
              'optical-matrix-text-label': 'Texto para codificar',
              'optical-matrix-generate': 'Gerar matriz'
          }
          missing = {k:v for k,v in translations.items() if dialogs.get(k) != v}
          if missing:
              # Insert keys without reformatting the whole translation file.
              text = p.read_text(encoding='utf-8')
              marker = '        "animated-qr-title": "Transferência QR Animada",'
              insert = marker + ''.join(f'\n        "{k}": {json.dumps(v, ensure_ascii=False)},' for k,v in missing.items())
              if marker not in text:
                  raise SystemExit('Translation insertion marker not found')
              text = text.replace(marker, insert, 1)
              p.write_text(text, encoding='utf-8')

          # 5) Xiaomi Redmi 9C / narrow Android WebView: reduce card spacing and prevent horizontal overflow.
          p = root / 'public/scripts/animated-qr-screen-awake.js'
          s = p.read_text(encoding='utf-8')
          marker = '#chat-send .icon,#chat-send svg{width:20px;height:20px;min-width:20px;min-height:20px;max-width:20px;max-height:20px;display:block;flex:0 0 20px}'
          addition = marker + '\n@media(max-width:390px){x-dialog#animated-qr-main-dialog x-background{padding:4px 4px 10px}#animated-qr-main-dialog .erikraft-qr-card-send,#animated-qr-main-dialog .erikraft-qr-card-receive{width:100%;box-sizing:border-box;padding:12px 10px;margin:0;gap:8px}#animated-qr-main-dialog .erikraft-qr-card-send .font-body2,#animated-qr-main-dialog .erikraft-qr-card-receive .font-body2{line-height:1.35;margin-bottom:6px}.erikraft-qr-paper{max-width:100%;box-sizing:border-box}}'
          if '@media(max-width:390px){x-dialog#animated-qr-main-dialog' not in s and marker in s:
              s = s.replace(marker, addition, 1)
          p.write_text(s, encoding='utf-8')

          # 6) Use the official WebTorrent brand source instead of a hand-drawn torrent glyph.
          icon = root / 'public/images/icons/webtorrent-official.svg'
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WebTorrent"><image href="https://webtorrent.io/img/WebTorrent.png" width="512" height="512" preserveAspectRatio="xMidYMid meet"/></svg>\n''', encoding='utf-8')

          p = root / 'public/scripts/webtorrent-transfer.js'
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "const icon = (viewBox, path) => `<svg class=\"webtorrent-icon\" viewBox=\"${viewBox}\" aria-hidden=\"true\" focusable=\"false\"><path d=\"${path}\"></path></svg>`;",
              "const icon = (viewBox, path) => `<svg class=\"webtorrent-icon\" viewBox=\"${viewBox}\" aria-hidden=\"true\" focusable=\"false\"><path d=\"${path}\"></path></svg>`;\n    const officialBrandIcon = '<img class=\"webtorrent-icon webtorrent-official-icon\" src=\"images/icons/webtorrent-official.svg\" alt=\"WebTorrent\">';"
          )
          s = s.replace("const icons = {", "const icons = {\n        brand: officialBrandIcon,")
          s = s.replace("button.innerHTML = icons.magnet;", "button.innerHTML = icons.brand;")
          s = s.replace(".webtorrent-brand .webtorrent-icon { width:22px; height:22px; }", ".webtorrent-brand .webtorrent-icon { width:22px; height:22px; object-fit:contain; }\n            #webtorrent-btn .webtorrent-official-icon { width:20px; height:20px; object-fit:contain; display:block; }")
          # Robust dialog open/close for Android WebView implementations.
          s = s.replace("#webtorrent-dialog::backdrop { background:rgba(0,0,0,.68); backdrop-filter:blur(6px); }", "#webtorrent-dialog::backdrop { background:rgba(0,0,0,.68); backdrop-filter:blur(6px); }\n            #webtorrent-dialog[open] { display:block; }")
          s = s.replace("const close = () => dialog.close();", "const close = () => { try { if (typeof dialog.close === 'function' && dialog.open) dialog.close(); else dialog.removeAttribute('open'); } catch (_) { dialog.removeAttribute('open'); } };")
          s = s.replace("if (typeof dialog.showModal === 'function') dialog.showModal();\n            else dialog.setAttribute('open', '');", "try { if (typeof dialog.showModal === 'function' && !dialog.open) dialog.showModal(); else dialog.setAttribute('open', ''); } catch (_) { dialog.setAttribute('open', ''); }")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/scripts/optical-matrix-ui.js public/scripts/animated-qr-screen-awake.js public/scripts/webtorrent-transfer.js public/lang/pt-BR.json public/images/icons/webtorrent-official.svg
          git rm -f .github/workflows/fix-10-1-4-optical-torrent-ui.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: repair optical matrix and torrent mobile UI"
          git push origin HEAD:fix/drop-10.1.4-stability-cleanup
