name: Finalize 10.1.3

on:
  push:
    branches: [fix/v10.1.3-finalize]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Finalize repository
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          root = Path('.')
          old_versions = [
              'v1.16.5', '1.16.5', 'v1.16.6', '1.16.6',
              'v10.1.1', '10.1.1', 'v10.1.2', '10.1.2',
          ]

          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.pdf', '.zip',
              '.jar', '.aar', '.apk', '.aab', '.exe', '.deb', '.bin', '.woff',
              '.woff2', '.ttf', '.otf', '.mp4', '.webm', '.mp3', '.pptx', '.pdn'
          }

          def text_files():
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  if '.git' in path.parts or 'node_modules' in path.parts:
                      continue
                  if path.suffix.lower() in binary_suffixes:
                      continue
                  try:
                      path.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  yield path

          # The release identity is 10.1.3 everywhere. Do not leave legacy
          # web/service-worker or old Android-era version strings behind.
          for path in text_files():
              data = path.read_text(encoding='utf-8')
              updated = data
              for old in old_versions:
                  updated = updated.replace(old, 'v10.1.3' if old.startswith('v') else '10.1.3')
              if updated != data:
                  path.write_text(updated, encoding='utf-8')

          # Remove the obsolete moderation implementation and all direct HTML
          # resource references to it. Do not replace it with a dead shim.
          for rel in [
              'public/scripts/content-moderation.js',
              'public/styles/content-moderation.css',
              'server/proxy-server.js',
              'server/model/model.json',
          ]:
              path = root / rel
              if path.exists():
                  path.unlink()

          for rel in ['public/index.html']:
              path = root / rel
              if path.exists():
                  lines = path.read_text(encoding='utf-8').splitlines(True)
                  lines = [
                      line for line in lines
                      if 'content-moderation.js' not in line and 'content-moderation.css' not in line
                  ]
                  path.write_text(''.join(lines), encoding='utf-8')

          # Remove only the explicitly obsolete moderation translation keys.
          moderation_keys = {
              'moderation-warning-title',
              'moderation-warning-message',
              'moderation-no',
              'moderation-yes',
              'explicit',
              'spam',
              'offensive-content-detected',
          }

          def clean_json(value):
              if isinstance(value, dict):
                  result = {}
                  for key, child in value.items():
                      if key in moderation_keys:
                          continue
                      result[key] = clean_json(child)
                  return result
              if isinstance(value, list):
                  return [clean_json(item) for item in value]
              return value

          for path in (root / 'public/lang').glob('*.json'):
              try:
                  original = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              cleaned = clean_json(original)
              if cleaned != original:
                  path.write_text(json.dumps(cleaned, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Keep the version in package.json authoritative, then regenerate the
          # npm lockfile rather than hand-editing lock metadata.
          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '10.1.3'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          subprocess.run(['npm', 'install', '--package-lock-only', '--ignore-scripts'], check=True)

          # Ensure the three requested reference repositories remain declared.
          gitmodules = (root / '.gitmodules').read_text(encoding='utf-8')
          required = [
              'https://github.com/download-directory/download-directory.github.io',
              'https://github.com/onionshare/onionshare-android',
              'https://github.com/gedsh/invizible',
          ]
          missing = [url for url in required if url not in gitmodules]
          if missing:
              raise SystemExit('Missing required reference submodule(s): ' + ', '.join(missing))
          PY

          # The task is complete only when no obsolete version/moderation
          # references remain in tracked text files.
          if git grep -n -E 'v1\.16\.[0-9]+|(^|[^0-9])1\.16\.[0-9]+([^0-9]|$)|v10\.1\.[12]([^0-9]|$)|(^|[^0-9])10\.1\.[12]([^0-9]|$)' -- ':!References/*'; then
            echo 'ERROR: legacy version references remain.'
            exit 1
          fi

          if git grep -n -E 'content-moderation|ContentModeration|moderation-warning-title|moderation-warning-message|offensive-content-detected' -- ':!References/*'; then
            echo 'ERROR: legacy moderation references remain.'
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --cached .github/workflows/finalize-10.1.3.yml 2>/dev/null || true
          git add -A
          git commit -m 'fix: finalize 10.1.3 repository cleanup'
          git push
