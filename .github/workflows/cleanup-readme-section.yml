name: One-time README cleanup

on:
  push:
    branches:
      - fix/android-webview-startup-compat

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy Brazilian comparison section
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 🇧🇷 O que diferencia o ErikrafT Drop™ do PairDrop?'
          end_marker = '## 🔗 Shared and Inherited Features'

          start = text.find(marker)
          if start == -1:
              raise SystemExit('Legacy Brazilian section not found; nothing to remove.')

          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('End marker for the legacy Brazilian section was not found.')

          updated = text[:start].rstrip() + '\n\n' + text[end:]
          path.write_text(updated, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-readme-section.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/cleanup-readme-section.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: remove legacy Brazilian README section'
          git push
