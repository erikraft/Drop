name: finalize-10-1-4-cleanup
on:
  push:
    branches: [fix/drop-10.1.4-stability-cleanup]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize cleanup and validate
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          root=Path('.')
          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')

          p=root/'public/index.html'; s=read(p)
          # Remove the legacy Animated QR header button completely; Animated QR dialogs/features remain intact.
          s=re.sub(r'\s*<div\s+id="animated-qr-btn"\b.*?</div>\s*','\n',s,flags=re.S|re.I)
          # Remove any remaining legacy blocks from the visible client shell.
          for ident in ['lan-mode','cloud','comet','browseros','comet-popup','browseros-popup','discord','limewire']:
              s=re.sub(r'\s*<!--[^>]*'+re.escape(ident)+r'[^>]*-->\s*','\n',s,flags=re.I)
          write(p,s)

          p=root/'public/scripts/main.js'; s=read(p)
          s=s.replace('return Promise.all([...stylePromises, ...scriptPromises]);','return Promise.allSettled([...stylePromises, ...scriptPromises]);')
          write(p,s)

          p=root/'public/service-worker.js'; s=read(p)
          s=s.replace("version: '10.1.3'","version: '10.1.4'")
          helper='''const isValidCacheResponse = (request, response) => {\n    if (!response || !response.ok || response.type === 'opaque') return false;\n    const url = new URL(request.url);\n    const path = url.pathname.toLowerCase();\n    const contentType = (response.headers.get('content-type') || '').toLowerCase();\n    if (path.endsWith('.js')) return contentType.includes('javascript') || contentType.includes('ecmascript');\n    if (path.endsWith('.css')) return contentType.includes('text/css');\n    if (path.endsWith('.json')) return contentType.includes('json') || contentType.includes('text/plain');\n    if (path.endsWith('.html') || request.mode === 'navigate') return contentType.includes('text/html');\n    return true;\n};\n\n'''
          if 'const isValidCacheResponse' not in s:
              s=s.replace('const createManifestFallback = () =>',helper+'const createManifestFallback = () =>',1)
          s=s.replace("if (!response || !response.ok || response.type === 'opaque' || doNotCacheRequest(request)) return;","if (!isValidCacheResponse(request, response) || doNotCacheRequest(request)) return;")
          s=s.replace("if (!response.ok || response.type === 'opaque' ||\n                    (response.redirected && new URL(response.url).origin !== self.location.origin)) {","if (!isValidCacheResponse(new Request(new URL(path, rootUrl).href), response) ||\n                    (response.redirected && new URL(response.url).origin !== self.location.origin)) {")
          write(p,s)

          # Make the assetlinks route explicit and keep dot-files reachable despite express.static defaults.
          p=root/'server/server.js'; s=read(p)
          if "app.get('/.well-known/assetlinks.json'" not in s:
              needle="        const publicPathAbs = path.join(__dirname, '../public');\n        app.use(express.static(publicPathAbs));"
              repl="""        const publicPathAbs = path.join(__dirname, '../public');\n        const assetLinksPath = path.join(publicPathAbs, '.well-known', 'assetlinks.json');\n        app.get('/.well-known/assetlinks.json', (req, res) => {\n            res.type('application/json').sendFile(assetLinksPath);\n        });\n        app.use(express.static(publicPathAbs));"""
              s=s.replace(needle,repl,1)
          write(p,s)

          # Remove temporary migration marker and this workflow after changes are committed.
          marker=root/'.migration-trigger-10.1.4'
          if marker.exists(): marker.unlink()
          wf=root/'.github/workflows/finalize-10-1-4-cleanup.yml'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True); subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','-A'],check=True); subprocess.run(['git','commit','-m','fix: remove remaining legacy UI and harden cache'],check=False)
          if wf.exists(): wf.unlink()
          subprocess.run(['git','add','-A'],check=True); subprocess.run(['git','commit','-m','chore: remove temporary finalize workflow'],check=False)
          subprocess.run(['git','push'],check=True)
