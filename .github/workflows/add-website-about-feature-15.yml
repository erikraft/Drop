name: Add Website About Feature 15

on: push

jobs:
  add-feature:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Feature 15
        run: |
          python3 -c 'from pathlib import Path; p=Path("Website About/NEW/index.html"); t=p.read_text(encoding="utf-8"); marker="<!-- Feature 14 -->"; start=t.find(marker); end=t.find("         </div>\\n      </div>\\n   </section>", start); feature="""            <!-- Feature 15 — Current Updates -->\n            <div class=\"glass-card p-8 rounded-2xl\" data-lordicon-hover-card>\n               <div class=\"w-14 h-14 bg-sky-500/10 rounded-xl flex items-center justify-center mb-6 border border-sky-500/20\">\n                  <i class=\"fa-solid fa-arrows-rotate text-sky-400 text-2xl\"></i>\n               </div>\n               <h3 class=\"text-xl font-bold text-white mb-3\">Current Updates</h3>\n               <p class=\"text-gray-400 leading-relaxed\">Stay up to date with the latest improvements, new features, fixes, performance updates, and compatibility enhancements in ErikrafT Drop™. Follow the <a href=\"https://github.com/erikraft/Drop/commits/master/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"text-sky-400 hover:underline\">latest changes on GitHub</a> to see what is new.</p>\n            </div>\n\n"""; assert start >= 0 and end >= 0; assert "<!-- Feature 15 — Current Updates -->" not in t; p.write_text(t[:end]+feature+t[end:], encoding="utf-8")'
      - name: Validate
        run: grep -q '<!-- Feature 15 — Current Updates -->' 'Website About/NEW/index.html'
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Website About/NEW/index.html'
          git commit -m 'feat: add About NEW Feature 15 Current Updates'
          git rm '.github/workflows/add-website-about-feature-15.yml'
          git commit -m 'chore: remove temporary Feature 15 workflow'
          git push
