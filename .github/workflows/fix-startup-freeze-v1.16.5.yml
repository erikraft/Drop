name: Apply v1.16.5 startup freeze fix

on:
  push:
    branches:
      - fix/startup-loading-freeze-v1.16.5

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/startup-loading-freeze-v1.16.5
          fetch-depth: 0

      - name: Patch startup loading and version references
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          root = Path('.')

          main_path = root / 'public/scripts/main.js'
          main = main_path.read_text(encoding='utf-8')

          old_scripts = """            'scripts/browser-tabs-connector.js',
            'scripts/util.js',
            'scripts/pairdrop-adapter.js',
            'scripts/libs/qr-code-styling.js',
            'scripts/qr-helper.js',
            'scripts/erikraft-qr.js',
            'scripts/security-layer.js',
            'scripts/animated-qr-controls.js',
            'scripts/animated-qr-file-size.js',
            'scripts/animated-qr-screen-awake.js',
            'scripts/network.js',
            'scripts/ui.js',
            'scripts/libs/heic2any.min.js',
            'scripts/libs/no-sleep.min.js',
            'scripts/libs/zip.min.js'"""

          new_scripts = """            // Critical startup dependencies: keep their execution ordered.
            'scripts/browser-tabs-connector.js',
            'scripts/util.js',
            'scripts/pairdrop-adapter.js',
            'scripts/libs/qr-code-styling.js',
            'scripts/qr-helper.js',
            'scripts/erikraft-qr.js',
            'scripts/security-layer.js',
            'scripts/animated-qr-controls.js',
            'scripts/animated-qr-file-size.js',
            'scripts/network.js',
            'scripts/ui.js',
            // Optional enhancements are loaded after the interactive shell is ready.
            'scripts/animated-qr-screen-awake.js',
            'scripts/libs/heic2any.min.js',
            'scripts/libs/no-sleep.min.js',
            'scripts/libs/zip.min.js'"""

          if old_scripts not in main:
              raise SystemExit('Expected deferredScripts block was not found in main.js')
          main = main.replace(old_scripts, new_scripts, 1)

          old_loader = """    loadDeferredAssets() {
        const stylePromises = this.deferredStyles.map(url => this.loadAndApplyStylesheet(url));
        const scriptPromises = this.deferredScripts.map(url => this.loadAndApplyScript(url));
        return Promise.all([...stylePromises, ...scriptPromises]);
    }"""

          new_loader = """    async loadDeferredAssets() {
        const stylePromises = this.deferredStyles.map(url => this.loadAndApplyStylesheet(url));

        // Only scripts required to construct the interactive application are awaited here.
        // Optional enhancements must never be able to leave the entire shell in its loading state.
        const criticalScripts = [];
        const optionalScripts = [];
        let optionalPhase = false;

        for (const url of this.deferredScripts) {
            if (url === 'scripts/animated-qr-screen-awake.js') optionalPhase = true;
            (optionalPhase ? optionalScripts : criticalScripts).push(url);
        }

        const criticalPromises = criticalScripts.map(url => this.loadAndApplyScript(url, { timeoutMs: 5000 }));
        await Promise.all([...stylePromises, ...criticalPromises]);

        // Start optional scripts in parallel after the critical shell is available.
        Promise.all(
            optionalScripts.map(url => this.loadAndApplyScript(url, { timeoutMs: 5000, async: true }))
        ).catch(error => console.warn('[App] Optional deferred assets failed:', error));
    }"""

          if old_loader not in main:
              raise SystemExit('Expected loadDeferredAssets implementation was not found in main.js')
          main = main.replace(old_loader, new_loader, 1)

          old_load_script = """    loadScript(url) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = url;
            script.async = false;
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
        });
    }"""

          new_load_script = """    loadScript(url, options = {}) {
        const { timeoutMs = 5000, async = false } = options;

        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            let settled = false;
            let timeoutId = null;

            const finish = (callback, value) => {
                if (settled) return;
                settled = true;
                if (timeoutId) clearTimeout(timeoutId);
                callback(value);
            };

            script.src = url;
            script.async = async;
            script.onload = () => finish(resolve);
            script.onerror = error => finish(reject, error);

            timeoutId = setTimeout(() => {
                finish(reject, new Error(`Timed out loading script after ${timeoutMs}ms: ${url}`));
            }, timeoutMs);

            document.body.appendChild(script);
        });
    }"""

          if old_load_script not in main:
              raise SystemExit('Expected loadScript implementation was not found in main.js')
          main = main.replace(old_load_script, new_load_script, 1)

          old_apply = """    async loadAndApplyScript(url) {
        try {
            await this.loadScript(url);
            console.log(`Script loaded successfully: ${url}`);
        } catch (error) {
            console.error('Error loading script:', url, error);
        }
    }"""

          new_apply = """    async loadAndApplyScript(url, options = {}) {
        try {
            await this.loadScript(url, options);
            console.log(`Script loaded successfully: ${url}`);
        } catch (error) {
            console.warn('[App] Deferred script unavailable; continuing without blocking startup:', url, error);
        }
    }"""

          if old_apply not in main:
              raise SystemExit('Expected loadAndApplyScript implementation was not found in main.js')
          main = main.replace(old_apply, new_apply, 1)
          main_path.write_text(main, encoding='utf-8')

          index_path = root / 'public/index.html'
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'("softwareVersion"\s*:\s*")1\.16\.[0-9]+("?)', r'\g<1>1.16.5\2', index, count=1)
          index_path.write_text(index, encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '1.16.5'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = root / 'public/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '1.16.5'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          sw_path = root / 'public/service-worker.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("const cacheVersion = 'v1.16.4';", "const cacheVersion = 'v1.16.5';", 1)
          sw_path.write_text(sw, encoding='utf-8')

          bug_path = root / '.github/ISSUE_TEMPLATE/bug-report.md'
          bug = bug_path.read_text(encoding='utf-8')
          bug = bug.replace('Version: v1.16.4', 'Version: v1.16.5', 1)
          bug_path.write_text(bug, encoding='utf-8')

          # Guard against accidentally leaving the previous release identifier in the files
          # intentionally updated by this release bump.
          for path in [main_path, index_path, package_path, manifest_path, sw_path, bug_path]:
              text = path.read_text(encoding='utf-8')
              if 'v1.16.4' in text or '"1.16.4"' in text:
                  raise SystemExit(f'Old v1.16.4 reference remains in {path}')

          print('Startup loading fix and v1.16.5 version bump applied successfully.')

      - name: Validate JavaScript syntax
        run: |
          node --check public/scripts/main.js
          node --check public/service-worker.js

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-startup-freeze-v1.16.5.yml
          git add public/scripts/main.js public/index.html package.json public/manifest.json public/service-worker.js .github/ISSUE_TEMPLATE/bug-report.md .github/workflows/fix-startup-freeze-v1.16.5.yml
          git commit -m 'fix: prevent startup shell from being blocked by deferred scripts' || exit 0
          git push origin fix/startup-loading-freeze-v1.16.5
