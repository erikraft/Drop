# Apply labels from the pull request's checked-in path configuration.
# Skip fork PRs because repository secrets are not available to pull_request events
# from forks; this avoids using pull_request_target with untrusted checkout content.

name: Labeler
on: [pull_request]

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply pull request labels
        uses: actions/labeler@ac9175f8a1f3625fd0d4fb234536d26811351594 # v4
        with:
          repo-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
