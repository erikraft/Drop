name = "erikraft-drop-failover"
main = "failover.js"
compatibility_date = "2024-01-01"

[vars]
PRIMARY_HOST = "drop.erikraft.com"
FALLBACK_HOST = "drop-fallback.erikraft.com"
HEALTH_CHECK_PATH = "/health"
HEALTH_CHECK_INTERVAL = "30000"
FAILURE_THRESHOLD = "3"
RECOVERY_THRESHOLD = "2"

