services:
  - type: web
    name: erikraft-drop
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: RATE_LIMIT
        value: "5"
      - key: ONION_PRIVATE_KEY_BASE64
        sync: false
