appId: io.github.erikraft.Drop
productName: ErikrafT Drop™
executableName: erikraft-drop
artifactName: ${name}-${version}-${os}-${arch}.${ext}
directories:
  output: dist/desktop
files:
  - desktop/**
  - server/**
  - public/**
  - packaging/linux/icons/android-chrome-512x512.png
  - package.json
extraMetadata:
  main: desktop/main.cjs
extraResources:
  - from: desktop/WinSparkle
    to: WinSparkle
    filter:
      - WinSparkle.dll
linux:
  target:
    - target: deb
      arch:
        - x64
  category: Network;Utility;
  # Use the branded Drop icon for Linux packages and generate the required sizes from it.
  icon: packaging/linux/icons/android-chrome-512x512.png
  desktop:
    entry:
      Name: ErikrafT Drop™
      Comment: File sharing by ErikrafT
      Icon: erikraft-drop
      Terminal: 'false'
      Type: Application
      Categories: Network;Utility;
      Keywords: file;transfer;sharing
deb:
  artifactName: erikraft-drop-linux-amd64.deb
  maintainer: ErikrafT <contact+app@erikraft.com>
  packageName: erikraft-drop
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
win:
  target:
    - nsis
  # Official Windows application/installer icon.
  icon: desktop/assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ErikrafT Drop™
  installerIcon: desktop/assets/icon.ico
  uninstallerIcon: desktop/assets/icon.ico
