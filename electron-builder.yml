appId: io.github.erikraft.Drop
productName: ErikrafT Drop™
executableName: erikraft-drop
artifactName: ${name}-${version}-${os}-${arch}.${ext}
directories:
  output: dist/desktop
files:
  - desktop/**
  - server/**
  - public/**
  - package.json
extraMetadata:
  main: desktop/main.cjs
linux:
  target:
    - target: deb
      arch:
        - x64
  category: Network;Utility;
  # Keep the repository's Linux icon assets available for manual customization.
  # When no linux.icon is set, electron-builder generates the Linux icon set from
  # the official Windows ICO configured below, keeping one official source icon.
  desktop:
    entry:
      Name: ErikrafT Drop™
      Comment: File sharing by ErikrafT
      Icon: erikraft-drop
      Terminal: 'false'
      Type: Application
      Categories: Network;Utility;
      Keywords: file;transfer;sharing
deb:
  artifactName: erikraft-drop-linux-amd64.deb
  maintainer: ErikrafT <contact+app@erikraft.com>
  packageName: erikraft-drop
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
win:
  target:
    - nsis
  # Official Windows application/installer icon.
  icon: desktop/assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ErikrafT Drop™
  installerIcon: desktop/assets/icon.ico
  uninstallerIcon: desktop/assets/icon.ico
