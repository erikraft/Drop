    <style>
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        @keyframes fadeOutSlow {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        #comet-popup {
            animation: slideInUp 0.5s ease-out;
        }

        #comet-popup.fade-out {
            animation: fadeOutSlow 3s ease-out forwards;
        }

        #comet-popup-content {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        #comet-popup-icon {
            flex-shrink: 0;
            width: 64px;
            height: 64px;
        }

        #comet-popup-text {
            flex: 1;
        }

        #comet-popup-text h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }

        #comet-popup-text p {
            margin: 0 0 16px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        #comet-popup-close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 24px;
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        #comet-popup-close-btn:hover {
            opacity: 1;
        }

        /* Desktop: direita no topo */
        @media (min-width: 769px) {
            #comet-popup {
                position: fixed !important;
                top: 80px !important;
                right: 16px !important;
                left: auto !important;
                transform: none !important;
                max-width: 420px !important;
            }
        }

        /* Mobile: apenas topo */
        @media (max-width: 768px) {
            #comet-popup {
                display: none !important;
            }
        }

        #comet-popup-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        .comet-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        #comet-download-btn {
            background: #15acbd;
            color: #222222;
        }

        #comet-download-btn:hover {
            background: #15acbd;
        }

        /* BrowserOS popup: reuse Comet styles but keep icon smaller */
        #browseros-popup {
            animation: slideInUp 0.5s ease-out;
        }

        #browseros-popup.fade-out {
            animation: fadeOutSlow 3s ease-out forwards;
        }

        #browseros-popup-content {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        #browseros-popup-icon {
            flex-shrink: 0;
            width: 63px;
            height: 63px;
            margin-top: 0;
            color: #f36320;
            fill: currentColor;
        }

        #browseros-popup-text {
            flex: 1;
        }

        #browseros-popup-text h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #f36320;
        }

        #browseros-popup-text p {
            margin: 0 0 16px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        #browseros-popup-close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 24px;
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        #browseros-popup-close-btn:hover {
            opacity: 1;
        }

        #browseros-download-btn {
            background: #f36320;
            color: #fff;
        }

        #browseros-download-btn:hover {
            background: #d94f0a;
        }

        @media (min-width: 769px) {
            #browseros-popup {
                position: fixed !important;
                top: 80px !important;
                right: 16px !important;
                left: auto !important;
                transform: none !important;
                max-width: 420px !important;
            }
